<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Web Application</title>
</head>
<body>
    <h2>Liste des employées</h2>
    <table>
        <thead>
            <tr>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${employees.empty}">
                <td colspan="3">Aucun employé en base de données</td>
            </tr>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.firstName}">Prénom</td>
                <td th:text="${employee.lastName}">Nom</td>
                <td>
                    <a th:href="@{/updateEmployee/{id}(id=${employee.id})}">modifier</a> |
                    <a th:href="@{/deleteEmployee/{id}(id=${employee.id})}">supprimer</a>
                </td>
            </tr>
        </tbody>
    </table>

    <p><a th:href="@{/createEmployee}">Créer un nouvel employé</a></p>
</body>
</html>
